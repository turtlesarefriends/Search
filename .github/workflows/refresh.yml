name: Refresh nationwide coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build nationwide coverage
        run: python refresh.py
        env:
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          
            - name: Publish refreshed data
        run: |
          echo "Generated coverage file:"
          ls -lh coverage.json
          python -c "import json; d=json.load(open('coverage.json')); print('Legislators:', len(d.get('legislators', [])), 'Branches:', d.get('branch_count'))"

          git config user.name "coverage-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add -f coverage.json
          git status --short

          if git diff --cached --quiet; then
            echo "ERROR: coverage.json was not changed"
            exit 1
          fi

          git commit -m "Refresh nationwide legislative coverage"
          git push origin HEAD:main
