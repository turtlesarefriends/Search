<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneMain Legislative Coverage Finder</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#172b4d;color:#fff;padding:50px 20px 80px}.wrap{max-width:1050px;margin:auto}h1{font-size:42px;margin:25px 0 10px}.lead{max-width:720px;line-height:1.6;color:#dce5f5}.search{margin:-45px auto 25px;background:#fff;padding:18px;border-radius:16px;box-shadow:0 10px 30px #0001}.row{display:grid;grid-template-columns:1fr 200px 180px 110px;gap:10px}input,select,button{height:48px;border-radius:9px;font-size:15px}input,select{border:1px solid #d5dce8;padding:0 12px}button{border:0;background:#315efb;color:#fff;font-weight:bold}.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.stat,.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.name{margin:0;font-size:20px}.meta,.muted{color:#687386;font-size:13px;margin-top:5px}.pill{display:inline-block;margin-top:10px;background:#eef2ff;color:#3150c8;padding:6px 9px;border-radius:99px;font-size:12px;font-weight:bold}.num{font-size:30px;font-weight:bold;margin-top:18px}.branch{border-top:1px solid #edf0f5;padding:12px 0}.branch strong{display:block}.branch span{display:block;color:#687386;font-size:13px;margin-top:4px}.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd3df;border-radius:14px;padding:45px;text-align:center;color:#687386}@media(max-width:800px){.row,.grid{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body>
<header><div class="wrap"><b>ONEMAIN × STATE LEGISLATIVE COVERAGE</b><h1>Find which state legislators cover OneMain branches.</h1><div class="lead">Search a legislator by name and identify OneMain Financial branch locations inside that legislator's state district.</div></div></header>
<main class="wrap"><section class="search"><div class="row"><input id="q" placeholder="Search legislator name…"><select id="state"><option value="">All states</option></select><select id="chamber"><option value="">Both chambers</option><option value="upper">State Senate</option><option value="lower">State House / Assembly</option></select><button onclick="render()">Search</button></div></section>
<div class="stats"><div class="stat"><b>50</b> states supported</div><div class="stat"><b id="n">0</b> demo legislators</div></div><section id="results" class="grid"><div class="empty">Search for a legislator to begin.</div></section></main>
<script src="data.js"></script><script>
const states=[["AL","Alabama"],["AK","Alaska"],["AZ","Arizona"],["AR","Arkansas"],["CA","California"],["CO","Colorado"],["CT","Connecticut"],["DE","Delaware"],["FL","Florida"],["GA","Georgia"],["HI","Hawaii"],["ID","Idaho"],["IL","Illinois"],["IN","Indiana"],["IA","Iowa"],["KS","Kansas"],["KY","Kentucky"],["LA","Louisiana"],["ME","Maine"],["MD","Maryland"],["MA","Massachusetts"],["MI","Michigan"],["MN","Minnesota"],["MS","Mississippi"],["MO","Missouri"],["MT","Montana"],["NE","Nebraska"],["NV","Nevada"],["NH","New Hampshire"],["NJ","New Jersey"],["NM","New Mexico"],["NY","New York"],["NC","North Carolina"],["ND","North Dakota"],["OH","Ohio"],["OK","Oklahoma"],["OR","Oregon"],["PA","Pennsylvania"],["RI","Rhode Island"],["SC","South Carolina"],["SD","South Dakota"],["TN","Tennessee"],["TX","Texas"],["UT","Utah"],["VT","Vermont"],["VA","Virginia"],["WA","Washington"],["WV","West Virginia"],["WI","Wisconsin"],["WY","Wyoming"]];
states.forEach(x=>{let o=document.createElement("option");o.value=x[0];o.textContent=x[1];document.getElementById("state").appendChild(o)});
document.getElementById("n").textContent=ONEMAIN_DATA.length;
function render(){let q=document.getElementById("q").value.toLowerCase(),s=document.getElementById("state").value,c=document.getElementById("chamber").value;let a=ONEMAIN_DATA.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!s||x.state==s)&&(!c||x.level==c));document.getElementById("results").innerHTML=a.length?a.map(x=>'<article class="card"><h2 class="name">'+x.name+'</h2><div class="meta">'+x.state+' · '+x.chamber+' · District '+x.district+'</div><span class="pill">'+x.party+'</span><div class="num">'+x.branches.length+'</div><div class="muted">OneMain branch'+(x.branches.length==1?'':'es')+'</div>'+x.branches.map(b=>'<div class="branch"><strong>'+b[0]+'</strong><span>'+b[1]+'</span></div>').join('')+'</article>').join(''):'<div class="empty"><h3>No matches found</h3><div>Try another name or state.</div></div>'}
</script></body></html>
